<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Study Task Planner</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="login-page">

<!-- =========================================
     LOGIN PAGE LAYOUT
========================================= -->

    <div class="login-wrapper">

        <!-- APPLICATION INTRODUCTION -->

        <div class="login-left">

            <!-- Application branding and feature overview -->

            <div class="brand-content">

                <h1>
                    <i class="fa-solid fa-graduation-cap"></i>
                    Student Study Task Planner
                </h1>

                <p class="tagline">
                    Organize your studies, manage assignments,
                    track deadlines and stay productive.
                </p>

                <ul class="features">

                    <li>
                        <i class="fa-solid fa-check"></i>
                        Task Management
                    </li>

                    <li>
                        <i class="fa-solid fa-check"></i>
                        Study Scheduling
                    </li>

                    <li>
                        <i class="fa-solid fa-check"></i>
                        Smart Prioritization
                    </li>

                    <li>
                        <i class="fa-solid fa-check"></i>
                        Progress Analytics
                    </li>

                    <li>
                        <i class="fa-solid fa-check"></i>
                        Calendar Integration
                    </li>

                </ul>

            </div>

        </div>

        <!-- USER AUTHENTICATION -->

        <div class="login-right">

            <!-- Login and registration form -->

            <div class="login-card">

                <h2>Welcome Back</h2>

                <p class="login-subtitle">
                    Sign in or create your student account
                </p>

                <input type="email" id="email" placeholder="Student Email">

                <div class="password-wrapper">

                    <input type="password" id="password" placeholder="Password">

                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('password')"></i>

                </div>

                <div class="password-wrapper">

                    <input type="password" id="confirmPassword" placeholder="Confirm Password">

                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('confirmPassword')"></i>

                </div>

                <!-- Authentication buttons -->

                <div class="login-buttons">

                    <button class="register-btn" onclick="register()">
                        Register
                    </button>

                    <button class="login-btn" onclick="login()">
                        Login
                    </button>

                </div>

                <p id="loginMessage"></p>

            </div>

        </div>

    </div>

    <!-- Password visibility toggle -->
    <script>
        function togglePassword(id) {

            const field =
                document.getElementById(id);

            field.type =
                field.type === "password"
                    ? "text"
                    : "password";

        }
    </script>

    <!-- Login page functionality -->
    <script src="login.js"></script>

</body>

</html>
